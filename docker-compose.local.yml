# ============================================================
#  Configuración LOCAL de desarrollo (aislada de producción)
#  Proyecto Compose propio: "pruebas-app-local"
#  - No toca docker-compose.yml (producción local VPS)
#  - No toca Supabase: DATABASE_URL siempre local (db:5432 interno,
#    localhost:55432 desde el host, alineado con TEST_DATABASE_URL)
#  - PostgreSQL + API (hot reload) + Vite (hot reload)
#
#  Levantar:   docker compose -f docker-compose.local.yml up -d --build
#  Detener:    docker compose -f docker-compose.local.yml down
#  Logs:       docker compose -f docker-compose.local.yml logs -f
#  Verificar:  docker compose -f docker-compose.local.yml config
#
#  Puertos host:
#    db     -> 55432  (evita colisión con PG nativo y con docker-compose.yml)
#    api    -> 5000
#    client -> 5173
# ============================================================
name: pruebas-app-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "${PG_LOCAL_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: sh -c "npm run setup && npm run dev"
    environment:
      # NUNCA Supabase aquí. Dentro de Docker el host es `db`; desde el host es localhost:55432.
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgres://platform:platform@db:5432/platform?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: ""
    volumes:
      - ./api/src:/app/src
      - ./api/scripts:/app/scripts
      - ./api/schema.sql:/app/schema.sql
      - ./api/assets:/app/assets
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
