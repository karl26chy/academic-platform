services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
    command: sh -c "node scripts/setup.js && node src/server.js"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@db:5432/${POSTGRES_DB:-platform}
      # Obligatorio: sin él (o con el de ejemplo) la API no arranca.
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (al menos 32 caracteres aleatorios)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Dominio(s) del frontend separados por coma; vacío = solo mismo origen.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Proxies delante del API (nginx del cliente = 1; súmale uno por cada proxy extra).
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      # Plantillas de boletín en vivo: los cambios de CSS/HTML aplican sin rebuild
      - ./api/src/templates:/app/src/templates:ro
    ports:
      # Solo accesible desde el propio servidor: el público entra por el nginx
      # del cliente. Exponerlo saltaría el proxy y permitiría falsear la IP.
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  client:
    build:
      context: ./client
    environment:
      # Solo local: api:5000 resuelve al servicio api del compose.
      PORT: "80"
      BACKEND_URL: http://api:5000
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
