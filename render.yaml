# Render Blueprint - Plataforma Educativa (contenedor único)
# Arquitectura: GitHub -> un solo Web Service (Dockerfile.production)
#   -> Express sirve el frontend compilado (client/dist) + la API bajo /api
#   -> Supabase/PostgreSQL.
# Sin secretos reales: DATABASE_URL se pide al crear el blueprint (sync: false)
# y JWT_SECRET se genera con generateValue.

services:
  - type: web
    name: platform
    runtime: docker
    dockerfilePath: Dockerfile.production
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: ""
