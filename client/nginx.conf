# ============================================================
#  Nginx - Kamak
#
#  Toda la plataforma vive en UN solo dominio (p. ej. kamak.co): ya no hay
#  un subdominio por colegio. Cada persona inicia sesión y entra a su
#  institución, que sale de su cuenta. Por eso basta un único bloque.
#
#  Plantilla de runtime: el entrypoint oficial de Nginx sustituye
#  ${PORT} y ${BACKEND_URL} (URL del backend).
#  En Docker Compose: PORT=80, BACKEND_URL=http://api:5000.
# ============================================================

server {
    listen ${PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad. Ningún "location" usa add_header: si alguno lo
    # hiciera, Nginx dejaría de enviar estas en esa ruta.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

    # Aplicación (SPA): las rutas internas recargan index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: todo lo que va a /api/ pasa al contenedor del backend.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
    }

    # Archivos con hash en el nombre (los genera Vite): se guardan 30 días.
    location /assets/ {
        expires 30d;
    }
}
